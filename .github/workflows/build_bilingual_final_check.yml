name: Build Bilingual Final Check Materials

on:
  workflow_dispatch:
  push:
    branches:
      - develop/bilingual-v1.1.0
    paths:
      - 'scripts/capture_notebook_code_contract.py'
      - 'scripts/build_bilingual_final_check.py'
      - 'scripts/build_final_check_guide.py'
      - '.github/workflows/build_bilingual_final_check.yml'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: true
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Capture released executable-cell contract
        run: >-
          python scripts/capture_notebook_code_contract.py
          --notebook notebooks/99_final_submission_check.ipynb
          --output content/notebook99_code_contract.json
          --source-release v1.0.0
          --purpose "Ensure the bilingual conversion preserves the released Notebook 99 executable logic."
      - name: Generate paired bilingual Notebook 99
        run: >-
          python scripts/build_bilingual_final_check.py
          --output-report check-output/notebook99-bilingual-build.json
      - name: Generate paired bilingual final-check guide
        run: python scripts/build_final_check_guide.py
      - name: Verify executable cells were preserved
        run: >-
          python scripts/check_notebook_code_contract.py
          --contract content/notebook99_code_contract.json
          --output check-output/notebook99-code-contract.json
      - name: Validate Notebook 99 structure and safety signals
        run: >-
          python scripts/check_final_check_notebook.py
          --output check-output/notebook99-structure.json
      - name: Commit generated contract, notebook and guide
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/notebook99_code_contract.json notebooks/99_final_submission_check.ipynb FINAL_CHECK_GUIDE.md
          if git diff --cached --quiet; then
            echo 'Generated final-check materials are already current.'
          else
            git commit -m 'Generate bilingual final-check materials'
            git push
          fi
      - name: Upload final-check build evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bilingual-final-check-build
          path: check-output
          retention-days: 14
