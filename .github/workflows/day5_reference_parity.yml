name: Day 5 Reference Parity

on:
  workflow_dispatch:
  push:
    paths:
      - 'notebooks/05_final_model.ipynb'
      - 'scripts/check_day5_reference_parity.py'
      - 'requirements*.txt'
      - 'constraints.txt'
      - '.github/workflows/day5_reference_parity.yml'
  pull_request:
    paths:
      - 'notebooks/05_final_model.ipynb'
      - 'scripts/check_day5_reference_parity.py'
      - 'requirements*.txt'
      - 'constraints.txt'
      - '.github/workflows/day5_reference_parity.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONIOENCODING: utf-8
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      ASSESSMENT_MODE: '1'
    steps:
      - name: Checkout bilingual candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Checkout released reference
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          path: reference
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install pinned CPU environment
        run: python -m pip install -r requirements-colab.txt -r requirements-check.txt -c constraints.txt
      - name: Execute and compare Day 5 outputs
        run: >-
          python scripts/check_day5_reference_parity.py
          --candidate-root .
          --reference-root reference
          --output check-output/day5-reference-parity.json
      - name: Upload parity evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: day5-reference-parity
          path: check-output
          retention-days: 14
